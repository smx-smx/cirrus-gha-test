env:
  CIRRUS_CLONE_DEPTH: 1
  CGO_ENABLED: 0

#
# Linux x64 — builds inside a Dockerfile-defined container image.
# Demonstrates:
#   1. Dockerfile-as-CI-environment with push to ghcr.io
#   2. Go module caching (fingerprinted on go.sum)
#   3. Build artifacts uploaded to GitHub Actions
#
linux_x64_task:

  container:
    dockerfile: .ci/linux/Dockerfile

  go_modules_cache:
    folder: $GOPATH/pkg/mod
    fingerprint_script: sha256sum go.sum
    populate_script: go mod download

  build_script: go build -o bin/demo .
  test_script:  go vet ./...

  binaries_artifacts:
    path: "bin/*"

#
# FreeBSD x64 — Cirrus CI ran this on a FreeBSD GCE VM (freebsd_instance).
# GHA has no FreeBSD runners, so the CLI boots the official FreeBSD
# BASIC-CI image under QEMU on the ubuntu runner and runs the scripts
# inside the VM. Cache/artifacts reuse the same GHA translation as the
# Linux task above. Fully automatic: plain `cirrus run` picks this up.
#
freebsd_task:

  freebsd_instance:
    image_family: freebsd-14-4

  # Keep the same shape as the Linux task to prove syntax parity:
  # cached modules, build, vet, uploaded binaries.
  go_modules_cache:
    folder: $GOPATH/pkg/mod
    fingerprint_script: sha256sum go.sum
    populate_script: go mod download

  build_script: go build -o bin/demo .
  test_script: go vet ./...

  binaries_artifacts:
    path: "bin/*"
