name: Cirrus CLI Demo
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  cirrus:
    name: ${{ matrix.task_name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            task_name: linux_x64

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Checkout cirrus-cli
        uses: actions/checkout@v4
        with:
          repository: smx-smx/cirrus-cli
          path: cirrus-cli

      - name: Build cirrus
        working-directory: cirrus-cli
        shell: bash
        run: go build -o cirrus ./cmd/cirrus/main.go

      - name: Add cirrus to PATH
        shell: bash
        run: echo "${{ github.workspace }}/cirrus-cli" >> $GITHUB_PATH

      - name: Expose GHA runtime vars
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run cirrus
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cirrus run --dockerfile-image-push --container-lazy-pull ${{ matrix.task_name }}
