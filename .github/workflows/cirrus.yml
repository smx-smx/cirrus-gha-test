name: Cirrus CLI Demo
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  cirrus:
    name: cirrus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      actions: write # module-cache translation talks to the GHA cache service
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install QEMU
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Enable KVM for the runner user
        shell: bash
        # /dev/kvm exists on hosted runners but is root:kvm 0660; without this
        # the FreeBSD task falls back to (much slower) TCG emulation.
        # See https://github.com/actions/runner-images/issues/8542
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Checkout cirrus-cli
        uses: actions/checkout@v4
        with:
          repository: smx-smx/cirrus-cli
          path: cirrus-cli

      - name: Build cirrus
        working-directory: cirrus-cli
        shell: bash
        run: go build -o cirrus ./cmd/cirrus/main.go

      - name: Add cirrus to PATH
        shell: bash
        run: echo "${{ github.workspace }}/cirrus-cli" >> $GITHUB_PATH

      - name: Expose GHA runtime vars
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run cirrus
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No task filter: cirrus runs every task in .cirrus.yml, including
          # freebsd (Skipped until the QEMU backend lands, then automatic).
          cirrus run --dockerfile-image-push --container-lazy-pull
